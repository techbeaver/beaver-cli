version: 2

project_name: beaver

before:
  hooks:
    - go mod tidy
    - ./scripts/check-no-secrets.sh

builds:
  - id: beaver
    main: ./cmd/beaver
    binary: beaver
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: beaver
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Notarise the macOS builds. quill runs on any platform, so this needs no macOS
# runner. Skipped when the secrets are absent, which is how a fork builds.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [beaver]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"

# Keyless signing: the signature is bound to the GitHub Actions identity that
# produced it, so a customer verifies provenance without us holding a key.
#
# Signs checksums.txt rather than each binary. Signing the binaries directly
# names every signature after the binary, and the binary is called `beaver` on
# all five targets — so five artifacts collide on one asset name and the upload
# fails after everything is already built. checksums.txt covers every archive,
# so one signature over it proves the lot.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}
      - --yes
    output: true

# Homebrew and Scoop are not published yet, on purpose.
#
# Both need a repository that does not exist (techbeaver/homebrew-tap,
# techbeaver/scoop-bucket) and a token that can push to it, which the release
# job's GITHUB_TOKEN cannot do because it is scoped to this repository. Left
# configured, goreleaser fails the whole release at the upload step, after the
# binaries are already built and published.
#
# To enable: create the two repositories, add a PAT with write access as a
# secret, and add it to the release job's env. `brews` is deprecated in
# goreleaser v2, so use homebrew_casks when it comes back.

release:
  draft: false
  prerelease: auto
  footer: |
    ## Install

    ```sh
    curl -fsSL https://techbeaver.io/install.sh | sh
    ```

    ## Verify what you downloaded

    checksums.txt is signed with cosign, keyless, so the signature is bound to
    the GitHub Actions run that built it rather than to a key we hold. Verify
    the checksum file, then check your archive against it.

    ```sh
    cosign verify-blob \
      --certificate checksums.txt.pem \
      --signature   checksums.txt.sig \
      --certificate-identity-regexp 'https://github.com/techbeaver/beaver-cli' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      checksums.txt

    sha256sum -c checksums.txt --ignore-missing
    ```

    install.sh already checks the archive against checksums.txt for you.

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
